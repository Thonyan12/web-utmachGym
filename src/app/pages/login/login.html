<section class="d-flex align-items-center justify-content-center animate__animated animate__fadeIn" 
         style="min-height: 80vh; background: linear-gradient(135deg, #0a1a2e 0%, #14213d 100%);">
  <div class="card shadow-lg p-4 border-2 position-relative" style="max-width: 400px; width: 100%; border-color: #fca311 !important;">
    
    <!-- Botón para volver atrás -->
    <button routerLink="/" class="btn btn-sm position-absolute" 
            style="top: 15px; left: 15px; color: #14213d; background-color: #fca311;">
      <i class="bi bi-arrow-left"></i> Volver
    </button>
    
    <div class="text-center mb-4">
      <img src="logomain.png" alt="Logo" width="80" class="mb-3 animate__animated animate__zoomIn">
      <h2 class="fw-bold" style="color: #14213d; position: relative;">
        <span style="display: inline-block; position: relative;">
          <span *ngIf="paso === 'credenciales'">Área Miembros</span>
          <span *ngIf="paso === 'verificacion-2fa'">Verificación 2FA</span>
          <span style="position: absolute; bottom: -5px; left: 0; width: 100%; height: 2px; background: #fca311; border-radius: 3px;"></span>
        </span>
      </h2>
      <p class="text-muted" *ngIf="paso === 'credenciales'">Solo para miembros del gimnasio</p>
      <p class="text-muted" *ngIf="paso === 'verificacion-2fa'">Código enviado a tu correo</p>
    </div>

    <!-- ========================================
         PASO 1: CREDENCIALES
         ======================================== -->
    <form *ngIf="paso === 'credenciales'" (ngSubmit)="onSubmit()">
      <!-- Mostrar errores -->
      <div *ngIf="error" class="alert alert-danger d-flex align-items-center">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <div>{{ error }}</div>
      </div>

      <div class="mb-4">
        <label for="usuario" class="form-label fw-medium" style="color: #14213d;">Usuario/Email</label>
        <input 
          type="text" 
          class="form-control py-2 border-2" 
          id="usuario" 
          placeholder="Ingresa tu usuario o email" 
          [(ngModel)]="usuario"
          name="usuario"
          required 
          [disabled]="loading"
          style="border-color: #14213d;">
      </div>
      
      <div class="mb-4">
        <label for="contrasenia" class="form-label fw-medium" style="color: #14213d;">Contraseña</label>
        <input 
          type="password" 
          class="form-control py-2 border-2" 
          id="contrasenia" 
          placeholder="Contraseña" 
          [(ngModel)]="contrasenia"
          name="contrasenia"
          required 
          [disabled]="loading"
          style="border-color: #14213d;">
      </div>
      
      <button 
        type="submit" 
        class="btn w-100 py-2" 
        style="background-color: #fca311; color: #0a1a2e; font-weight: 600; border: none;"
        [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        <i class="bi bi-box-arrow-in-right me-2" *ngIf="!loading"></i>
        {{ loading ? 'Verificando...' : 'Ingresar' }}
      </button>
    </form>

    <!-- ========================================
         PASO 2: VERIFICACIÓN 2FA
         ======================================== -->
    <div *ngIf="paso === 'verificacion-2fa'" class="animate__animated animate__fadeIn">
      <!-- Mensaje informativo -->
      <div class="alert alert-info text-center mb-4">
        <i class="bi bi-shield-lock-fill me-2"></i>
        Se ha enviado un código de verificación a tu correo
      </div>

      <!-- Email ofuscado -->
      <div class="text-center mb-4" *ngIf="emailOfuscado">
        <p class="text-muted mb-1">Código enviado a:</p>
        <p class="fw-bold" style="color: #14213d;">{{ emailOfuscado }}</p>
        <p class="text-muted small">El código expira en 10 minutos</p>
      </div>

      <!-- Input para código -->
      <div class="mb-4">
        <label for="codigo2fa" class="form-label fw-medium text-center w-100" style="color: #14213d;">
          Ingresa el código de 6 dígitos
        </label>
        <input 
          type="text" 
          class="form-control form-control-lg text-center fw-bold border-2" 
          id="codigo2fa" 
          [(ngModel)]="codigoVerificacion"
          maxlength="6"
          placeholder="000000"
          [disabled]="loading"
          style="border-color: #14213d; letter-spacing: 8px; font-size: 1.5rem;">
      </div>

      <!-- Botón verificar -->
      <button type="button" class="btn w-100 py-2 mb-3" 
              [disabled]="codigoVerificacion.length !== 6 || loading"
              [style]="codigoVerificacion.length === 6 ? 
                      'background-color: #fca311; color: #0a1a2e; font-weight: 600; border: none;' : 
                      'background-color: #cccccc; color: #666666; font-weight: 600; border: none;'"
              (click)="verificarCodigo2FA()">
        <span *ngIf="!loading">
          <i class="bi bi-check-circle me-2"></i> Verificar y Acceder
        </span>
        <span *ngIf="loading">
          <span class="spinner-border spinner-border-sm me-2"></span> Verificando...
        </span>
      </button>

      <!-- Reenviar código -->
      <div class="text-center mb-3">
        <button type="button" class="btn btn-link text-decoration-none" 
                [disabled]="countdown > 0"
                (click)="reenviarCodigo2FA()"
                style="color: #fca311;">
          <i class="bi bi-arrow-clockwise me-1"></i>
          <span *ngIf="countdown > 0">Reenviar código en {{ countdown }}s</span>
          <span *ngIf="countdown === 0">Reenviar código</span>
        </button>
      </div>

      <!-- Volver a credenciales -->
      <div class="text-center">
        <button type="button" class="btn btn-sm" 
                style="background-color: transparent; color: #14213d; border: 1px solid #14213d;"
                (click)="volverACredenciales()">
          <i class="bi bi-arrow-left me-1"></i> Volver al login
        </button>
      </div>

      <!-- Mostrar errores -->
      <div *ngIf="error" class="alert alert-danger mt-3 text-center">
        <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
      </div>
    </div>
    
    <div *ngIf="paso === 'credenciales'" class="mt-4 text-center">
      <a routerLink="/registro" class="text-decoration-none fw-medium me-3" style="color: #fca311;">
        <i class="bi bi-person-plus me-1"></i> ¿No tienes cuenta? Regístrate
      </a>
      <br><br>
      <a routerLink="/staff-login" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-gear me-1"></i> Soy Staff
      </a>
    </div>
  </div>
</section>
